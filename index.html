<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda Ventas</title>
<style>
body{font-family:Arial;padding:20px;background:#f4f4f4}
.caja{background:white;padding:20px;border-radius:10px;max-width:500px;margin:auto}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:1px solid #ccc}
button{background:#28a745;color:white;border:none;font-weight:bold;cursor:pointer}
table{width:100%;margin-top:15px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
.total{font-size:20px;font-weight:bold;color:green;margin-top:15px}
</style>
</head>
<body>
<div class="caja">
<h2>🛒 Mi Tienda - Ventas</h2>
<input id="producto" placeholder="Nombre del producto">
<input id="precio" type="number" placeholder="Precio">
<button onclick="agregar()">Agregar Producto</button>
<table id="tabla"><tr><th>Producto</th><th>Precio</th></tr></table>
<div class="total">Total: S/ <span id="total">0</span></div>
<button onclick="vender()" style="background:#007bff">Vender y Limpiar</button>
</div>
<script>
let total=0;
function agregar(){
let p=document.getElementById('producto').value;
let pr=parseFloat(document.getElementById('precio').value);
if(!p||!pr)return alert('Escribe producto y precio');
let tabla=document.getElementById('tabla');
tabla.innerHTML+=`<tr><td>${p}</td><td>S/ ${pr}</td></tr>`;
total+=pr;
document.getElementById('total').innerText=total;
document.getElementById('producto').value='';
document.getElementById('precio').value='';
}
function vender(){
alert('Venta realizada por S/ '+total);total=0;
document.getElementById('total').innerText=0;
document.getElementById('tabla').innerHTML='<tr><th>Producto</th><th>Precio</th></tr>';
}
</script>
</body>
</html>
